name: r15_companion
description: Android-first companion for the R15 Smart Cluster, with future iOS support.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/bike-opening.png
    - assets/illustrations/bike-home.png
    - assets/fonts/inter/OFL.txt
    - assets/fonts/chakra-petch/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/chakra-petch/ChakraPetch-BoldItalic.ttf
          weight: 700
          style: italic
