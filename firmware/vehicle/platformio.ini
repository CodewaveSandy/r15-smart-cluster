[platformio]
src_dir = main
build_dir = ../../build/vehicle

[env:sevensemi-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
build_unflags = -std=gnu++2b -std=gnu++23
; 7Semi official DevKit pinout labels RGB on GPIO48. See development guide
; for source/provenance and the application-start zero-frame driver.
build_flags =
    -std=gnu++17
    -DR15_VEHICLE_LED_KIND=3
    -DR15_VEHICLE_LED_GPIO=48
platform_packages =
    framework-espidf @ https://github.com/pioarduino/esp-idf/releases/download/v5.5.4/esp-idf-v5.5.4.tar.xz
