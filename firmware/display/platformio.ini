[platformio]
src_dir = main
build_dir = ../../build/display

[env:crowpanel-v3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
monitor_speed = 115200
build_unflags = -std=gnu++2b -std=gnu++23
build_flags = -std=gnu++17
platform_packages =
    framework-espidf @ https://github.com/pioarduino/esp-idf/releases/download/v5.5.4/esp-idf-v5.5.4.tar.xz
